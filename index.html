<style>
/* App de visita técnica OBRABIT: uma coluna de toque largo; cabeçalho fixo com abas Cliente · Ambientes · Fechar visita */
:root{
  --bg:#EEF1F3; --surface:#FFFFFF; --sunk:#E3E8EC; --line:#CDD5DC;
  --fg:#16212B; --muted:#5B6873; --accent:#1D5FA8; --accent-ink:#FFFFFF; --accent-soft:#DCE8F6;
  --mark:#F2B632; --ok:#2E7D4F; --warn:#B86E00; --bad:#B3392F;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161C; --surface:#18212A; --sunk:#0C1116; --line:#2C3843;
  --fg:#E6ECF1; --muted:#97A5B1; --accent:#5B9BE0; --accent-ink:#0B1622; --accent-soft:#1D3047;
  --mark:#F2B632; --ok:#5BBF83; --warn:#E3A33C; --bad:#E2766C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161C; --surface:#18212A; --sunk:#0C1116; --line:#2C3843;
  --fg:#E6ECF1; --muted:#97A5B1; --accent:#5B9BE0; --accent-ink:#0B1622; --accent-soft:#1D3047;
  --mark:#F2B632; --ok:#5BBF83; --warn:#E3A33C; --bad:#E2766C; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:2rem;line-height:1.05}
h2{font-size:1.45rem}
h3{font-size:1.2rem}
.eyebrow{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:.8rem;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
input,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:72px;resize:vertical}
label.lbl{display:block;font-weight:600;font-size:.92rem;margin-bottom:6px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.toprow{display:flex;align-items:center;gap:10px;min-height:44px}
.toprow .t{flex:1;min-width:0}
.toprow .t b{display:block;font-family:var(--f-display);font-size:1.25rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;min-width:44px;height:44px;display:grid;place-items:center;font-size:1.2rem}
.sync{font-size:.78rem;display:flex;align-items:center;gap:6px;color:var(--muted);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
@media (max-width:440px){.sync .lbl2{display:none}}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.tabs button{flex:1;border:0;background:none;padding:10px 8px 12px;font-family:var(--f-display);font-weight:600;font-size:1.02rem;letter-spacing:.03em;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--mark);color:#1B1400;font-family:var(--f-body);font-size:.75rem;font-weight:600;margin-left:4px;line-height:20px;text-align:center}

.stack{display:flex;flex-direction:column;gap:14px}
.stack>*,.secbody>*,.field>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 16px;font-weight:600;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--fg)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{height:6px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:42px;font-size:.95rem;display:inline-flex;align-items:center;gap:8px;line-height:1.15;text-align:left}
.chip.hasic{border-radius:10px;padding:6px 12px 6px 8px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip .sw{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.25);flex:none}
.chip .sw.stone{border-radius:4px;width:22px}
.chip.later{border-style:dashed}
svg.ic{width:40px;height:27px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.ic .ac{stroke:var(--mark)}
.chip[aria-pressed="true"] svg.ic .ac{stroke:currentColor;stroke-dasharray:2 2}
.field{display:flex;flex-direction:column;gap:8px}
.field .fl{font-weight:600;font-size:.95rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field .fl .req{color:var(--warn);font-size:.78rem;font-weight:600}
.infobtn{border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;font-size:.78rem;font-weight:600;padding:2px 10px;min-height:28px}
.infobtn[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink)}
.hint{margin:0;font-size:.88rem;background:var(--accent-soft);border-radius:8px;padding:8px 12px;line-height:1.4}
.hint b{font-weight:600}
.guide{background:var(--sunk);border-radius:8px;padding:6px 12px;display:flex;flex-direction:column}
.guide .gi{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.guide .gi:last-child{border-bottom:0}
.guide .gi .gv{width:40px;flex:none;display:grid;place-items:center;padding-top:2px}
.guide .gi .gv .sw{width:22px;height:22px;border-radius:4px;border:1px solid rgba(0,0,0,.25)}
.guide .gi div{font-size:.88rem;line-height:1.38}
.guide .gi div b{display:block;font-size:.93rem}
.numrow{display:flex;align-items:center;gap:8px}
.numrow input{max-width:140px}

.roomcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.roomcard .nm{font-family:var(--f-display);font-weight:700;font-size:1.25rem}
.roomcard .meta{font-size:.86rem;color:var(--muted)}
.roomcard .grow{flex:1;min-width:0}
.prog{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--ok)}
.typegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.typegrid button{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:12px;font-weight:600;min-height:52px;text-align:left}

details.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.sec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;min-height:56px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .sn{font-family:var(--f-display);font-weight:700;font-size:1.18rem;flex:1}
details.sec>summary .st{font-size:.8rem;color:var(--muted);text-align:right;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.sec>summary .st.on{color:var(--ok);font-weight:600}
details.sec>summary::after{content:"";width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:4px;flex:none}
details.sec[open]>summary::after{transform:rotate(-135deg)}
.secbody{padding:16px 16px 18px;display:flex;flex-direction:column;gap:20px;border-top:1px dashed var(--line)}
.ask{margin:0;font-size:.86rem;color:var(--muted);font-style:italic}

.med{background:var(--sunk);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.med .grid3 input{font-family:var(--f-mono)}
.calc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.calc div{background:var(--surface);border-radius:8px;padding:8px 10px;border:1px solid var(--line)}
.calc b{display:block;font-family:var(--f-mono);font-size:1.1rem;font-variant-numeric:tabular-nums}
.calc span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
@media (max-width:420px){.calc{grid-template-columns:1fr 1fr}}

.vcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.vcard .nm{font-family:var(--f-display);font-weight:700;font-size:1.35rem;line-height:1.1}
.pill{display:inline-block;font-size:.74rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.draft{color:var(--warn)}.pill.done{color:var(--ok)}.pill.ex{color:var(--muted)}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center}
.hero{padding:26px 0 18px;display:flex;flex-direction:column;gap:8px}
.hero p{margin:0;max-width:60ch;color:var(--muted)}
.pend{background:color-mix(in srgb,var(--mark) 16%,var(--surface));border:1px solid var(--mark);border-radius:var(--r);padding:14px 16px}
.pend ul{margin:6px 0 0;padding-left:20px}
.donebox{border:1px solid var(--ok);border-radius:var(--r);padding:14px 16px;background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:20;max-width:90vw}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:color-mix(in srgb,var(--bad) 12%,var(--surface));border:1px solid var(--bad);border-radius:8px;padding:10px}
/* levantamento e login */
.kv{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:4px 12px;font-size:.92rem;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.doc h3{margin-top:4px}
.doc .rm{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.doc .sh{font-weight:600;font-size:.95rem;margin:4px 0 2px}
.linkbtn{border:0;background:none;color:var(--accent);text-decoration:underline;padding:6px 4px;font-weight:600}
.who{text-align:center;margin:8px 0 0}
@media (prefers-reduced-motion:no-preference){.chip,.tabs button{transition:background .12s,border-color .12s,color .12s}}
</style>
</head>

demol:{n:"Demolição e retiradas",ask:"Tem algo para tirar, abrir ou derrubar?",f:[

  d:{"Abrir vão":"Fazer passagem nova na parede (porta, janela de serviço, integração). Precisa confirmar se a parede não é estrutural.","Ampliar vão":"Alargar ou subir uma passagem existente.","Fechar vão":"Fechar porta ou janela com tijolo ou drywall.","Derrubar parede":"Integrar ambientes. Em prédio, a parede pode ser estrutural: pedir planta ou avaliação de engenheiro.","Retirar portal":"Tirar a guarnição/batente de uma passagem para deixá-la livre."}},
 {id:"estrutural",l:"A parede pode ser estrutural?",t:"one",o:["Não","Sim / verificar","Não sei"],w:r=>has(r.itens,["Abrir vão","Ampliar vão","Derrubar parede"]),

piso:{n:"Piso",g:"acao",off:["Manter"],ask:"Quer trocar o piso deste ambiente?",f:[
 {id:"acao",l:"O que fazer com o piso",t:"one",o:["Manter","Trocar (retirar o antigo)","Piso sobre piso","Regularizar contrapiso","Reparo pontual"],
  d:{"Manter":"Não mexe no piso.","Trocar (retirar o antigo)":"Quebra o piso antigo e assenta o novo. Gera entulho e leva mais tempo, mas o nível do chão não muda.","Piso sobre piso":"Cola o piso novo por cima do antigo com argamassa própria. É mais rápido e limpo. O piso antigo precisa estar firme (sem peças ocas) e o chão sobe cerca de 1 cm, então pode ser preciso cortar portas.","Regularizar contrapiso":"Só nivelar a base, por exemplo para o cliente colocar vinílico ou laminado.","Reparo pontual":"Troca só as peças quebradas ou ocas. Só funciona se houver peça igual disponível."}},
 {id:"tipo",l:"Tipo de piso",t:"one",req:1,o:["Porcelanato","Cerâmica","Vinílico em régua","Vinílico em manta","Laminado","Ladrilho hidráulico","Madeira","Cimento queimado","Pedra natural","Epóxi / autonivelante","Outro"],w:PISO_ON,
  d:{"Porcelanato":"Absorve pouquíssima água e é muito resistente. Serve para qualquer ambiente e vem em peças grandes com junta fina. É o mais pedido.","Cerâmica":"Mais barata, absorve mais água e risca mais. Boa para área de serviço, garagem e obra econômica.","Vinílico em régua":"Réguas de PVC que imitam madeira. É confortável, silencioso e a instalação é rápida e limpa. Não vai em box, área externa ou lugar que se lava com balde.","Vinílico em manta":"Rolo contínuo, sem emendas. Comum em clínicas, comércio e quarto de criança.","Laminado":"Placa de MDF com acabamento de madeira, encaixada. Para quarto e sala secos, porque estufa se molhar.","Ladrilho hidráulico":"Peça de cimento colorida com desenho, estilo retrô. Precisa de impermeabilização. Há porcelanato que imita.","Madeira":"Taco ou assoalho natural. Nobre, mas precisa de manutenção (raspagem e verniz).","Cimento queimado":"Piso contínuo de cimento alisado, estilo industrial. Pode apresentar trincas.","Pedra natural":"Mármore, granito, ardósia ou pedra São Tomé. As rústicas são para área externa e piscina.","Epóxi / autonivelante":"Resina contínua, sem juntas. Para garagem, comércio ou visual moderno."}},
 {id:"formato",l:"Tamanho da peça",t:"one",o:["60×60","80×80","90×90","120×120","60×120","Régua 20×120","Régua 20×90","45×45","20×20","Outro"],w:PISO_ON,
  ic:{"60×60":"quad","80×80":"quad","90×90":"grande","120×120":"grande","60×120":"ret","Régua 20×120":"regua","Régua 20×90":"regua","45×45":"quad","20×20":"quad"},
  d:{"60×60":"Tamanho mais comum e econômico; pouca perda.","90×90":"Peça grande: dá sensação de amplitude, mas exige contrapiso bem nivelado e gera mais perda.","120×120":"Peça grande: dá sensação de amplitude, mas exige contrapiso bem nivelado e gera mais perda.","60×120":"Retangular grande, visual moderno.","Régua 20×120":"Porcelanato em régua que imita madeira e pode molhar.","Régua 20×90":"Porcelanato em régua que imita madeira e pode molhar.","20×20":"Peça pequena: ladrilho hidráulico ou estilo retrô."}},
 {id:"acab",l:"Acabamento da superfície",t:"one",o:["Polido","Acetinado","Fosco / natural","Antiderrapante","Amadeirado","Marmorizado","Cimentício"],w:PISO_ON,
  ic:{"Polido":"brilho","Acetinado":"acet","Fosco / natural":"fosco","Antiderrapante":"antiderr","Amadeirado":"amad","Marmorizado":"marm","Cimentício":"ciment"},
  d:{"Polido":"Brilhante e reflete a luz. Escorrega molhado, então é só para área seca (sala, quarto).","Acetinado":"Meio brilho, sofisticado e mais fácil de limpar que o fosco.","Fosco / natural":"Sem brilho e escorrega menos. Serve para tudo, inclusive banheiro e cozinha.","Antiderrapante":"Superfície áspera. Para área externa, piscina, garagem e rampa.","Amadeirado":"Porcelanato com desenho de madeira; pode molhar.","Marmorizado":"Imita mármore, com veios.","Cimentício":"Imita cimento queimado, sem as trincas."}},
 {id:"cor",l:"Cor do piso",t:"cor",req:1,w:PISO_ON},
 {id:"rejunte",l:"Tipo de rejunte",t:"one",o:["Cimentício","Acrílico","Epóxi"],w:PISO_ON,
  d:{"Cimentício":"O mais comum e barato. Absorve água e escurece com o tempo. Para área seca ou obra econômica.","Acrílico":"Mais liso e flexível e mancha menos. Bom para porcelanato em área interna, inclusive banheiro.","Epóxi":"Impermeável, não mancha e resiste a produtos de limpeza. Ideal para box, cozinha e piscina. É mais caro e mais demorado de aplicar."}},
 {id:"rejcor",l:"Cor do rejunte",t:"one",o:["Mesma cor do piso","Branco","Cinza","Grafite","Bege","Preto"],w:PISO_ON,
  d:{"Mesma cor do piso":"A junta quase some e o piso parece contínuo.","Branco":"Fica bonito, mas escurece com o tempo em piso.","Grafite":"Disfarça a sujeira e marca o desenho das peças."}},
 {id:"caimento",l:"Caimento para o ralo",t:"one",o:["Sim","Não"],wet:1,
  d:{"Sim":"O piso fica levemente inclinado para a água escorrer até o ralo. Obrigatório no box e em área externa."}},
 {id:"soleira",l:"Soleira na porta",t:"one",o:["Não","Granito preto","Granito branco","Mármore","Mesmo piso","Outro"],
  d:{"Granito preto":"Faixa de pedra embaixo da porta que separa pisos diferentes e segura a água do banheiro.","Mesmo piso":"Sem pedra: o piso passa direto pela porta."}},
 {id:"quem",l:"Quem compra o piso",t:"one",o:QUEM,d:DQUEM}
]},
revest:{n:"Revestimento de parede",g:"acao",off:["Manter","Não tem"],ask:"E as paredes, quer revestir ou trocar o revestimento?",f:[
 {id:"acao",l:"O que fazer",t:"one",o:["Manter","Não tem","Trocar (retirar o antigo)","Revestimento sobre revestimento","Revestir onde não tem"],
  d:{"Trocar (retirar o antigo)":"Quebra o azulejo antigo e assenta o novo.","Revestimento sobre revestimento":"Cola o novo por cima do antigo. É mais rápido, mas o antigo precisa estar firme. Tomadas, registros e caixilhos ficam mais fundos e precisam de prolongador."}},
 {id:"area",l:"Onde vai revestimento",t:"one",req:1,o:["Só área do box","Até o teto, todas as paredes","Meia parede (até 1,20 m)","Até 1,40 m (sobre bancada)","Faixa sobre a bancada","Uma parede de destaque","Outro"],
  d:{"Só área do box":"Reveste só o box; o resto da parede é pintado com tinta própria para banheiro. É a opção mais econômica.","Até o teto, todas as paredes":"Banheiro todo revestido. Mais caro, mais fácil de limpar.","Faixa sobre a bancada":"Só a faixa entre a bancada e o armário aéreo (cozinha).","Uma parede de destaque":"Revestimento decorativo em uma parede só."}},
 {id:"tipo",l:"Tipo de revestimento",t:"one",req:1,o:["Porcelanato","Cerâmica","Subway / metrô","Pastilha de vidro","Pastilha cerâmica","Ladrilho hidráulico","Pedra natural","Revestimento 3D","Outro"],
  d:{"Porcelanato":"Igual ao do piso. Em peças grandes, deixa a parede com aspecto limpo e com poucas juntas.","Cerâmica":"Econômica e ótima para parede, onde ninguém pisa.","Subway / metrô":"Peça pequena e retangular (7,5×15 ou 10×20), geralmente com borda chanfrada. Estilo clássico.","Pastilha de vidro":"Pecinhas de 2×2 cm em placas, com brilho. Usada em faixas decorativas e piscinas.","Pastilha cerâmica":"Igual à de vidro, mas fosca.","Ladrilho hidráulico":"Peça com desenho, estilo retrô.","Pedra natural":"Filetes de pedra (canjiquinha) para parede de destaque e área externa.","Revestimento 3D":"Peça com relevo. Parede de destaque na sala ou atrás da TV."}},
 {id:"formato",l:"Formato",t:"one",o:["Retangular","Quadrado","Metrô 7,5×15","10×30","30×60","60×120","Hexagonal","Espinha de peixe","Escama / leque","Outro"],
  ic:{"Retangular":"ret","Quadrado":"quad","Metrô 7,5×15":"metro","10×30":"longo","30×60":"ret","60×120":"grande","Hexagonal":"hex","Espinha de peixe":"espinha","Escama / leque":"escama"}},
 {id:"pag",l:"Como assentar",t:"one",o:["Horizontal alinhado","Vertical alinhado","Amarração (tijolinho)","Espinha de peixe","Diagonal"],
  ic:{"Horizontal alinhado":"alinH","Vertical alinhado":"alinV","Amarração (tijolinho)":"amarr","Espinha de peixe":"espinha","Diagonal":"diag"},
  d:{"Horizontal alinhado":"Juntas alinhadas e peças deitadas: alarga o ambiente.","Vertical alinhado":"Peças em pé: o ambiente parece mais alto.","Amarração (tijolinho)":"Cada fileira começa deslocada meia peça, como tijolo.","Espinha de peixe":"Peças em zigue-zague. Muito decorativo, gera mais perda e mão de obra.","Diagonal":"A 45°. Gera mais corte e perda."}},
 {id:"cor",l:"Cor do revestimento",t:"cor",req:1},
 {id:"rejcor",l:"Cor do rejunte",t:"one",o:["Mesma cor","Branco","Cinza","Grafite","Preto","Contraste"]},
 {id:"cantoneira",l:"Acabamento das quinas",t:"one",o:["Cantoneira de alumínio","Cantoneira inox","Cantoneira PVC","Meia-esquadria","Não precisa"],
  d:{"Cantoneira de alumínio":"Perfil metálico que protege a quina do revestimento. Econômico.","Cantoneira inox":"Mais durável e com visual moderno. Não enferruja.","Cantoneira PVC":"A mais barata, porém menos durável.","Meia-esquadria":"As peças são cortadas a 45° e se encontram na quina, sem perfil. Acabamento mais nobre, com mais mão de obra."}},
 {id:"nicho",l:"Nicho embutido",t:"one",o:["Não","1 nicho","2 nichos"],
  d:{"1 nicho":"Recorte na parede do box para apoiar shampoo e sabonete, revestido por dentro."}},
 {id:"nichomat",l:"Acabamento do nicho",t:"one",o:["Mesmo revestimento","Granito","Mármore","Porcelanato diferente"],w:r=>r.nicho&&r.nicho!=="Não"},
 {id:"imper",l:"Impermeabilização",t:"one",o:["Área do box","Piso todo + 30 cm de parede","Não precisa"],wet:1,
  d:{"Área do box":"Manta ou argamassa impermeável embaixo do revestimento, para não vazar para o vizinho de baixo. Obrigatória quando o box é refeito.","Piso todo + 30 cm de parede":"Para áreas que se lavam com água: área de serviço, varanda."}},
 {id:"quem",l:"Quem compra o revestimento",t:"one",o:QUEM,d:DQUEM}
]},
pintura:{n:"Pintura",g:"acao",off:["Não pintar"],ask:"Vai pintar? Paredes, teto ou os dois?",f:[
 {id:"acao",l:"O que pintar",t:"one",o:["Não pintar","Paredes e teto","Só paredes","Só teto","Retoque"]},
 {id:"estado",l:"Como estão as paredes",t:"one",o:["Boas, só pintar","Pequenas imperfeições","Trincas / descascando","Mofo / umidade"],
  d:{"Boas, só pintar":"Lixa leve e duas demãos.","Pequenas imperfeições":"Massa nos pontos com defeito e lixamento.","Trincas / descascando":"Raspagem e tratamento das trincas antes da massa.","Mofo / umidade":"Primeiro achar a causa (infiltração, vazamento). Depois tratar com fungicida e usar massa acrílica."}},
 {id:"prep",l:"Preparação",t:"many",o:["Raspagem","Correção de trincas","Massa corrida (PVA)","Massa acrílica","Selador","Lixamento","Tratamento de mofo / umidade","Regularizar requadro de janela"],
  d:{"Raspagem":"Tira tinta solta e descascada.","Correção de trincas":"Abre a trinca e trata com tela e selante para ela não voltar.","Massa corrida (PVA)":"Deixa a parede lisa. Só em área interna seca, porque não aguenta umidade.","Massa acrílica":"Deixa liso e resiste à umidade. Para banheiro, cozinha, área de serviço e área externa.","Selador":"Primeira demão em reboco novo ou massa, para a tinta aderir e render.","Tratamento de mofo / umidade":"Fungicida e, se preciso, impermeabilizante.","Regularizar requadro de janela":"Acerta as bordas tortas em volta da janela."}},
 {id:"tinta",l:"Tipo de tinta",t:"one",req:1,o:["Acrílica","Látex PVA","Esmalte","Epóxi","Textura","Grafiato","Efeito cimento queimado"],
  d:{"Acrílica":"A mais usada. Lavável e resistente à umidade. Serve para interno e externo.","Látex PVA":"Mais barata e não é lavável. Só para teto e área interna seca.","Esmalte":"Para madeira e metal: portas, batentes, grades e portões. É resistente e tem brilho.","Epóxi":"Muito resistente e impermeável. Para piso de garagem, azulejo antigo (pintar azulejo) e área de limpeza pesada.","Textura":"Tinta grossa com relevo que esconde imperfeições. Para fachada, muro e parede de destaque.","Grafiato":"Textura riscada com desempenadeira, aspecto mais rústico. Fachada e muro.","Efeito cimento queimado":"Imita parede de cimento, estilo industrial."}},
 {id:"acab",l:"Acabamento da tinta",t:"one",req:1,o:["Fosco","Acetinado","Semibrilho","Brilho"],
  ic:{"Fosco":"fosco","Acetinado":"acet","Semibrilho":"semi","Brilho":"brilho"},
  d:{"Fosco":"Sem brilho, esconde imperfeições da parede, mas é pouco lavável. Ideal para teto, sala e quarto de adulto.","Acetinado":"Leve brilho e lavável. Padrão para sala, quarto e corredor, principalmente com criança ou pet.","Semibrilho":"Mais lavável. Para cozinha, banheiro, área de serviço e portas.","Brilho":"Muito lavável, mas realça defeitos da parede. Para portas, grades e rodapé (esmalte)."}},
 {id:"linha",l:"Linha da tinta",t:"one",o:["Econômica","Standard","Premium"],
  d:{"Econômica":"Cobre menos e precisa de mais demãos. Boa para imóvel de aluguel.","Standard":"Equilíbrio entre preço e rendimento.","Premium":"Cobre melhor, rende mais e dura mais. Indicada para cores fortes."}},

 {id:"corteto",l:"Cor do teto",t:"cor",req:1,w:r=>["Paredes e teto","Só teto"].includes(r.acao)},
 {id:"destaque",l:"Parede de destaque (outra cor)",t:"one",o:["Não","Sim"]},
 {id:"cordest",l:"Cor da parede de destaque",t:"cor",w:r=>r.destaque==="Sim"},
 {id:"extras",l:"Pintar também",t:"many",o:["Portas (folha e batente)","Janelas / esquadrias","Grades / portão","Rodapé","Armário existente","Teto do box / área molhada"]}
]},
rodape:{n:"Rodapé",g:"acao",off:["Manter"],ask:"O rodapé fica ou troca?",f:[
 {id:"acao",l:"O que fazer",t:"one",o:["Manter","Trocar","Colocar (não tem)","Só retirar"]},
 {id:"mat",l:"Material",t:"one",req:1,o:["Poliestireno","MDF","Mesmo piso (porcelanato)","Cerâmica","Madeira","PVC","Granito / mármore","Embutido (invertido)","Outro"],w:r=>r.acao!=="Só retirar",
  d:{"Poliestireno":"Plástico rígido com aparência de rodapé de madeira pintado. Não apodrece, não estufa com água e é fácil de instalar. Hoje é o mais usado.","MDF":"Madeira prensada, normalmente branca. Bonito e barato, mas estufa se molhar. Não usar onde se lava o chão.","Mesmo piso (porcelanato)":"Tiras cortadas do próprio piso. Resiste à água e pode ser lavado. Bom para cozinha, área de serviço e varanda.","Cerâmica":"Econômico, para área molhada simples.","Madeira":"Nobre; combina com piso de madeira.","PVC":"Barato e tem canaleta para passar fios. Usado com vinílico e laminado.","Granito / mármore":"Para área externa, escada e hall.","Embutido (invertido)":"Fica rente ou para dentro da parede, efeito moderno de 'parede flutuando'. Precisa de mais trabalho no reboco."}},
 {id:"alt",l:"Altura",t:"one",req:1,o:["5 cm","7 cm","10 cm","12 cm","15 cm","Outro"],w:r=>r.acao!=="Só retirar",
  d:{"5 cm":"Discreto, moderno.","7 cm":"Padrão de apartamento.","10 cm":"Mais presença. Fica bom com pé-direito acima de 2,70 m.","15 cm":"Clássico e imponente, para pé-direito alto."}},
 {id:"cor",l:"Cor",t:"one",o:["Branco","Mesma cor da parede","Mesma cor do piso","Madeira","Preto"],w:r=>r.acao!=="Só retirar"}
]},
teto:{n:"Teto / gesso",g:"acao",off:["Manter"],ask:"Quer rebaixar o teto em gesso ou mexer no forro?",f:[
 {id:"acao",l:"O que fazer",t:"one",o:["Manter","Rebaixar em drywall","Rebaixar em gesso","Forro de PVC","Forro de madeira","Reparo no forro"],
  ic:{"Rebaixar em drywall":"drywall","Rebaixar em gesso":"gesso","Forro de PVC":"pvc","Forro de madeira":"madeiraForro"},
  d:{"Rebaixar em drywall":"Placas de gesso parafusadas em perfis de aço. É rápido e limpo, permite embutir spots e esconder fios e canos. Racha pouco.","Rebaixar em gesso":"Placas de gesso penduradas com arame (plaquinha 60×60 ou estucado). Mais barato, porém mais artesanal e pode trincar.","Forro de PVC":"Réguas de plástico. Barato e lavável; para área de serviço, varanda e garagem.","Forro de madeira":"Réguas de madeira; visual aconchegante ou rústico.","Reparo no forro":"Conserto de trincas, manchas ou partes caídas do forro existente."}},
 {id:"det",l:"Detalhes no gesso",t:"many",o:["Sanca aberta (luz indireta)","Sanca fechada","Tabica","Negativo","Cortineiro","Alçapão de inspeção"],
  ic:{"Sanca aberta (luz indireta)":"sancaAb","Sanca fechada":"sancaFe","Tabica":"tabica","Negativo":"negativo","Cortineiro":"cortineiro","Alçapão de inspeção":"alcapao"},
  d:{"Sanca aberta (luz indireta)":"Rebaixo na borda do teto com uma abertura onde fica uma fita de LED escondida. A luz bate no teto ou na parede e fica suave, indireta.","Sanca fechada":"Rebaixo na borda do teto, fechado embaixo, onde ficam spots embutidos. Muito usado em sala para iluminar paredes e quadros.","Tabica":"Perfil metálico em L entre o forro e a parede que forma um friso fino de sombra. Dá acabamento limpo e evita trinca no encontro.","Negativo":"Rasgo ou recuo de alguns centímetros no gesso, geralmente junto à parede. Cria uma linha de sombra, visual moderno.","Cortineiro":"Vão no forro junto à janela onde o trilho da cortina fica escondido. A cortina parece sair do teto.","Alçapão de inspeção":"Tampa removível para acessar registro, caixa de passagem ou ar-condicionado acima do forro."}},
 {id:"alt",l:"Altura final do teto (m)",t:"num",u:"m"}
]},
eletrica:{n:"Tomadas e interruptores",g:"acao",off:["Manter como está"],ask:"Vai trocar tomadas ou precisa de pontos novos?",f:[
 {id:"acao",l:"Tomadas e interruptores",t:"one",o:["Manter como está","Trocar só os acabamentos","Trocar acabamentos + novos pontos","Mudar pontos de lugar","Só novos pontos"],
  d:{"Trocar só os acabamentos":"Troca só as placas e módulos (a parte que aparece). Não mexe na parede.","Trocar acabamentos + novos pontos":"Troca as placas e abre a parede para pontos novos.","Mudar pontos de lugar":"Abre a parede, leva o ponto para outro lugar e fecha o antigo."}},
 {id:"ntom",l:"Novos pontos de tomada",t:"num",u:"un",w:r=>/novos|lugar/i.test(r.acao||"")},
 {id:"nint",l:"Novos interruptores",t:"num",u:"un",w:r=>/novos|lugar/i.test(r.acao||"")},
 {id:"esp",l:"Pontos especiais",t:"many",o:["Ar-condicionado","Chuveiro elétrico","Cooktop / forno","Micro-ondas","Máquina de lavar","Geladeira","TV / rede / internet","Tomada com USB","Aquecedor","Portão eletrônico"],
  d:{"Ar-condicionado":"Circuito próprio com disjuntor; 220 V na maioria dos aparelhos.","Chuveiro elétrico":"Fio grosso (6 mm² ou mais) e disjuntor próprio.","Cooktop / forno":"Cooktop de indução e forno elétrico precisam de circuito próprio."}},
 {id:"linhaac",l:"Cor das placas",t:"one",o:["Branco","Preto","Cinza / grafite","Dourado","Inox","Outro"]},
 {id:"quadro",l:"Quadro de luz",t:"one",o:["Não mexer","Novos disjuntores","Trocar quadro"],
  d:{"Novos disjuntores":"Para os circuitos novos (ar, chuveiro, cooktop).","Trocar quadro":"Quadro antigo, com fusível ou sem espaço. Avaliar também o padrão de entrada."}},
 {id:"fiacao",l:"Fiação",t:"one",o:["Manter","Trocar parcial","Trocar toda"],
  d:{"Trocar toda":"Para imóveis antigos (fio de pano ou ressecado) ou com disjuntor desarmando sempre."}}
]},
ilum:{n:"Iluminação / luminárias",g:"acao",off:["Manter"],ask:"Quer trocar as luminárias? Que estilo de luz?",f:[
 {id:"acao",l:"O que fazer",t:"one",o:["Manter","Trocar luminárias","Novo projeto de iluminação"],
  d:{"Novo projeto de iluminação":"Pontos novos de luz (spots, sanca, pendentes), normalmente junto com rebaixo de gesso."}},
 {id:"estilo",l:"Estilo das luminárias",t:"many",req:1,o:["Plafon LED de sobrepor","Plafon embutido","Spot embutido","Spot direcionável","Trilho com spots","Trilho magnético","Pendente","Lustre","Fita / perfil de LED","Arandela","Luminária tubular","Balizador","Espelho com LED"],
  ic:{"Plafon LED de sobrepor":"plafon","Plafon embutido":"plafonEmb","Spot embutido":"spot","Spot direcionável":"spotDir","Trilho com spots":"trilho","Trilho magnético":"trilhoMag","Pendente":"pendente","Lustre":"lustre","Fita / perfil de LED":"fita","Arandela":"arandela","Luminária tubular":"tubular","Balizador":"baliz","Espelho com LED":"espLED"},
  d:{"Plafon LED de sobrepor":"Luminária presa direto no teto. A escolha quando não há forro de gesso.","Plafon embutido":"Fica dentro do forro de gesso, rente ao teto. Precisa de gesso.","Spot embutido":"Pequeno, com luz concentrada; vários pontos no forro de gesso.","Spot direcionável":"Gira para iluminar quadro, bancada ou parede.","Trilho com spots":"Barra no teto com spots que se movem. Não precisa de gesso e tem visual moderno.","Trilho magnético":"Trilho fino embutido no gesso com módulos presos por ímã. Alto padrão.","Pendente":"Pendurado por fio, sobre mesa de jantar, ilha ou bancada.","Lustre":"Peça decorativa grande, normalmente na sala de jantar.","Fita / perfil de LED":"Luz em linha para sanca, armário, nicho e embaixo do aéreo da cozinha.","Arandela":"Luminária de parede para corredor, cabeceira e área externa.","Luminária tubular":"Comprida, luz forte; área de serviço e garagem.","Balizador":"Luz baixa na parede ou no piso para escada, jardim e corredor.","Espelho com LED":"Espelho de banheiro com luz embutida."}},
 {id:"qtd",l:"Quantidade de pontos de luz",t:"num",u:"un"},
 {id:"temp",l:"Cor da luz",t:"one",o:["Branco quente 3000K","Neutro 4000K","Branco frio 6500K","Ajustável (quente/frio)"],
  d:{"Branco quente 3000K":"Luz amarelada e aconchegante. Para sala e quarto.","Neutro 4000K":"Luz branca natural. Para cozinha, banheiro e escritório.","Branco frio 6500K":"Luz azulada e forte. Para área de serviço e garagem.","Ajustável (quente/frio)":"O cliente escolhe a cor da luz no interruptor ou no controle."}},
 {id:"corlum",l:"Cor da luminária",t:"one",o:["Branco","Preto","Dourado","Cromado","Madeira"]},
 {id:"quem",l:"Quem compra as luminárias",t:"one",o:QUEM,d:DQUEM}
]},
hidraulica:{n:"Hidráulica, gás e esgoto",ask:"Precisa mudar algum ponto de água? Tem vazamento ou infiltração?",f:[
 {id:"itens",l:"Serviços",t:"many",o:["Manter pontos","Remanejar ponto de água","Remanejar esgoto","Novo ponto de água","Ponto de máquina de lavar","Ponto de filtro","Ponto de geladeira","Novo registro","Trocar tubulação","Ralo linear","Ponto de gás","Aquecedor a gás","Mudar ducha higiênica de lado","Outro"],
  d:{"Remanejar esgoto":"Mudar ralo ou saída do vaso de lugar. Em apartamento, pode depender do andar de baixo.","Ralo linear":"Ralo comprido e fino junto à parede do box. O piso cai para um lado só, visual moderno.","Trocar tubulação":"Para cano antigo de ferro galvanizado ou com vazamentos frequentes."}},
 {id:"agua",l:"Água quente",t:"one",o:["Não tem","Chuveiro elétrico","Aquecedor a gás","Aquecedor elétrico (boiler)","Solar"]},
 {id:"prob",l:"Problema relatado pelo cliente",t:"many",o:["Vazamento","Infiltração","Retorno de água / entupimento","Pouca pressão","Nenhum"]}
]},
loucas:{n:"Louças e metais",ask:"Vai trocar vaso, cuba, torneira ou chuveiro?",f:[
 {id:"itens",l:"O que instalar",t:"many",o:["Vaso com caixa acoplada","Vaso com válvula","Vaso suspenso","Cuba de apoio","Cuba de embutir","Cuba de sobrepor","Lavatório de coluna","Tanque","Chuveiro elétrico","Chuveiro a gás / pressurizado","Ducha higiênica","Torneira","Misturador","Cooktop","Kit de acessórios"],
  d:{"Vaso com caixa acoplada":"A caixa de descarga fica presa atrás do vaso. É o padrão e não precisa quebrar parede.","Vaso com válvula":"Descarga na parede (válvula Hydra). Exige cano de maior diâmetro.","Vaso suspenso":"Preso na parede, com a caixa embutida. Alto padrão; precisa de estrutura e parede falsa.","Cuba de apoio":"Fica em cima da bancada, como uma bacia. Visual decorativo.","Cuba de embutir":"Fica por baixo ou dentro da bancada. É a mais fácil de limpar.","Cuba de sobrepor":"Encaixa no buraco da bancada com a borda apoiada por cima.","Lavatório de coluna":"Pia com pé de louça, sem bancada.","Misturador":"Uma só peça mistura água quente e fria (precisa ter água quente).","Kit de acessórios":"Porta-toalha, papeleira, saboneteira e gancho."}},
 {id:"cormet",l:"Cor dos metais",t:"one",o:["Cromado","Preto fosco","Dourado","Inox escovado","Rose gold","Grafite"]},
 {id:"padrao",l:"Padrão",t:"one",o:["Econômico","Intermediário","Alto padrão"]},
 {id:"quem",l:"Quem compra",t:"one",o:QUEM,d:DQUEM}
]},
bancada:{n:"Bancada",g:"acao",off:["Não mexer"],ask:"Bancada nova? De qual material?",f:[
 {id:"acao",l:"O que fazer",t:"one",o:["Não mexer","Bancada nova","Trocar a existente"]},
 {id:"mat",l:"Material",t:"one",req:1,o:["Granito natural","Quartzo","Granito sintético / marmoglass","Mármore","Nanoglass","Porcelanato","Inox","Concreto / cimento","Madeira","Outro"],
  d:{"Granito natural":"Pedra natural, resistente a calor e risco, com melhor custo. Os claros mancham mais.","Quartzo":"Pedra industrializada (tipo Silestone): cor uniforme e não mancha. Mais cara; evitar panela quente direto.","Granito sintético / marmoglass":"Resina com pó de pedra, branco liso. Mais barato que quartzo, mas pode riscar e amarelar.","Mármore":"Nobre e bonito, mas mancha e corrói com limão e vinagre. Melhor no banheiro que na cozinha.","Nanoglass":"Vidro cristalizado, branco brilhante. Caro.","Porcelanato":"Lâmina de porcelanato colada numa base. Visual de mármore com preço menor.","Inox":"Higiênico e moderno, estilo cozinha profissional.","Concreto / cimento":"Rústico ou industrial; precisa impermeabilizar.","Madeira":"Precisa de verniz. Não indicado perto da cuba."}},
 {id:"pedra",l:"Qual pedra",t:"one",o:["Preto São Gabriel","Preto Absoluto","Branco Siena","Branco Itaúnas","Branco Dallas","Cinza Andorinha","Cinza Corumbá","Verde Ubatuba","Marrom Café","Amarelo Ornamental","Ocre Itabira","Outro"],w:r=>["Granito natural","Mármore"].includes(r.mat),stone:1,
  d:{"Preto São Gabriel":"Preto com pontinhos claros. O mais vendido: não mancha e tem bom preço.","Preto Absoluto":"Preto uniforme, sem pontos. Mais caro e elegante.","Branco Siena":"Fundo claro com pontos cinza e vinho. Econômico; mancha um pouco.","Branco Itaúnas":"Branco amarelado com pontos. Absorve mais, precisa de impermeabilização.","Branco Dallas":"Fundo branco com pontos pretos marcados.","Cinza Andorinha":"Cinza médio, econômico e não mancha.","Cinza Corumbá":"Cinza com grãos maiores.","Verde Ubatuba":"Verde muito escuro, quase preto. Resistente e econômico.","Marrom Café":"Marrom escuro com grãos.","Amarelo Ornamental":"Bege amarelado, clássico.","Ocre Itabira":"Ocre ou caramelo com grãos."}},
 {id:"corsint",l:"Cor",t:"cor",w:r=>r.mat&&!["Granito natural","Mármore","Inox"].includes(r.mat)},
 {id:"comp",l:"Comprimento (m)",t:"num",u:"m"},
 {id:"prof",l:"Profundidade (cm)",t:"num",u:"cm"},
 {id:"borda",l:"Acabamento da borda",t:"one",o:["Reta","Meia-esquadria 4 cm","Boleada","Chanfrada"],
  ic:{"Reta":"bReta","Meia-esquadria 4 cm":"bMeia","Boleada":"bBol","Chanfrada":"bChanf"},
  d:{"Reta":"Borda simples, com a espessura da própria pedra (2 cm).","Meia-esquadria 4 cm":"Uma tira de pedra colada a 45° na frente, para a bancada parecer mais grossa (4 cm ou mais). Visual mais robusto.","Boleada":"Borda arredondada. Mais segura, sem quina viva.","Chanfrada":"Quina cortada em ângulo, discreta."}},
 {id:"front",l:"Frontispício (faixa na parede)",t:"one",o:["Não","10 cm","15 cm","Até o revestimento"],
  d:{"10 cm":"Faixa de pedra em pé, colada na parede atrás da bancada. Protege a parede da água.","Até o revestimento":"A pedra sobe até encontrar o revestimento."}},
 {id:"recortes",l:"Recortes",t:"many",o:["Cuba","Cooktop","Torneira de bancada","Escorredor embutido"],
  d:{"Escorredor embutido":"Canaletas cavadas na própria pedra ao lado da cuba."}},
 {id:"saia",l:"Saia / testeira",t:"one",o:["Não","Sim"],d:{"Sim":"Faixa de pedra que desce na frente da bancada e esconde a estrutura ou o sifão."}}
]},
vidro:{n:"Vidro temperado / box / espelho",ask:"Precisa de box, espelho ou divisória de vidro?",f:[
 {id:"itens",l:"O que instalar",t:"many",o:["Box de correr","Box de abrir","Box fixo","Box até o teto","Divisória fixa","Espelho","Porta de vidro","Guarda-corpo","Janela de vidro","Outro"],
  ic:{"Box de correr":"boxCorrer","Box de abrir":"boxAbrir","Box fixo":"boxFixo","Box até o teto":"boxTeto","Divisória fixa":"divis","Espelho":"espelho","Porta de vidro":"portaVidro","Guarda-corpo":"guarda"},
  d:{"Box de correr":"Uma folha fixa e outra que corre no trilho. O mais comum; bom para banheiro pequeno.","Box de abrir":"Porta que abre para fora, como uma porta comum. Precisa de espaço livre na frente.","Box fixo":"Só um painel de vidro, sem porta (box aberto). Simples e fácil de limpar.","Box até o teto":"O vidro vai do piso ao teto e segura o vapor (efeito sauna). Visual alto padrão.","Divisória fixa":"Vidro parado separando ambientes, como cozinha e sala sobre a bancada.","Guarda-corpo":"Proteção de vidro em varanda ou escada."}},
 {id:"vidro",l:"Tipo de vidro",t:"one",o:["Incolor","Fumê","Bronze","Jateado","Canelado","Espelhado"],
  d:{"Incolor":"Transparente; o padrão.","Fumê":"Escurecido, cinza.","Jateado":"Fosco, dá privacidade.","Canelado":"Com riscos verticais em relevo. Dá privacidade e está em alta."}},
 {id:"esp",l:"Espessura",t:"one",o:["6 mm","8 mm","10 mm"],d:{"8 mm":"Padrão para box.","10 mm":"Para porta, guarda-corpo e peças grandes."}},
 {id:"ferr",l:"Cor das ferragens / perfil",t:"one",o:["Cromado","Preto","Dourado","Branco","Inox"]}
]},

  d:{"Alumínio branco":"O mais usado, com bom preço e sem ferrugem.","PVC":"Isola melhor som e calor. Bom para rua barulhenta.","Ferro":"Mais barato, mas enferruja e precisa de pintura."}},
 {id:"jantipo",l:"Tipo de janela",t:"one",o:["Correr 2 folhas","Correr 4 folhas","Maxim-ar","Basculante","Camarão","Pivotante","Com veneziana"],w:r=>r.jan==="Trocar",
  ic:{"Correr 2 folhas":"jCorrer2","Correr 4 folhas":"jCorrer4","Maxim-ar":"jMaxim","Basculante":"jBasc","Camarão":"jCamarao","Pivotante":"jPivo","Com veneziana":"jVenez"},
  d:{"Correr 2 folhas":"Folhas que deslizam. O padrão de sala e quarto.","Correr 4 folhas":"Para vão largo; abre o meio.","Maxim-ar":"Abre para fora empurrando, articulada em cima. Ventila mesmo com chuva. Banheiro e cozinha.","Basculante":"Várias lâminas que giram juntas. Banheiro e área de serviço.","Camarão":"Folhas que dobram e abrem o vão inteiro. Varanda.","Pivotante":"Gira num eixo central. Visual moderno.","Com veneziana":"Tem lâminas que escurecem o quarto. Quarto."}},

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const has=(a,list)=>Array.isArray(a)&&a.some(x=>list.includes(x));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=v=>{if(v==null||v==="")return NaN;const s=String(v);return parseFloat(s.indexOf(",")>=0?s.replace(/\./g,"").replace(",","."):s);};
const fmt=(n,d=2)=>isFinite(n)?n.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d}):"—";
const empty=v=>v==null||v===""||(Array.isArray(v)&&!v.length);
function val(r,id){const v=r[id];if(empty(v))return "";const o=x=>x==="Outro"?(r[id+"_outro"]||"outro"):x;return Array.isArray(v)?v.map(o).join(", "):o(v);}
function corv(r,id){const n=r[id]||"",ref=r[id+"_ref"]||"";return n&&ref?`${n} (${ref})`:(n||ref);}
const lc=s=>s?s.charAt(0).toLowerCase()+s.slice(1):s;

const LS="obrabit_visitas_v1";
let visits={};
let ui={screen:"home",vid:null,tab:"cliente",rid:null,openSec:{},guide:{},confirmDel:null};
let db=null,syncState="local",inflight={},dirty={},unsub=null,fbOn=false;
const userEmail=()=>{try{return fbOn&&firebase.auth().currentUser?firebase.auth().currentUser.email||"":"";}catch(e){return "";}};
function loadLocal(){try{const raw=localStorage.getItem(LS);if(raw)visits=JSON.parse(raw)||{};}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(visits));}catch(e){}}
function newVisit(){const v={id:uid(),criado:new Date().toISOString(),atualizado:Date.now(),status:"rascunho",autor:userEmail(),
 cliente:{nome:"",tel:"",cpf:"",email:"",end:"",bairro:"",cidade:"Rio de Janeiro/RJ",cep:"",pd:"2,70"},geral:{},ambientes:[]};visits[v.id]=v;return v;}
let saveT=null;
function touch(v){v.atualizado=Date.now();saveLocal();clearTimeout(saveT);saveT=setTimeout(()=>pushRemote(v.id),700);setSync(db?"pending":"local");}
async function pushRemote(id){if(!db)return;if(!navigator.onLine){setSync("off");}const v=visits[id];if(!v)return;
 if(inflight[id]){dirty[id]=true;return;}
 inflight[id]=true;
 try{await db.collection("visitas").doc(id).set(JSON.parse(JSON.stringify(v)));setSync("ok");}
 catch(e){setSync(e&&e.code==="quota_exceeded"?"bad":"pending");}
 inflight[id]=false;if(dirty[id]){dirty[id]=false;pushRemote(id);}}
function setSync(s){syncState=s;const el=$("#sync");if(el)el.innerHTML=syncHTML();}
function syncHTML(){const m={local:["","Salvo neste aparelho"],pending:["warn","Enviando…"],ok:["ok","Salvo na nuvem"],bad:["bad","Erro ao salvar na nuvem"],off:["warn","Sem conexão: salvo no aparelho"]}[syncState]||["","Salvo"];
 return `<span class="dot ${m[0]}" title="${m[1]}"></span><span class="lbl2">${m[1]}</span>`;}
function initDb(){
 const cfg=window.FIREBASE_CONFIG;
 if(!cfg||!cfg.apiKey||/^COLE/.test(cfg.apiKey)||!window.firebase){setSync("local");return;}
 fbOn=true;ui.screen="boot";render();
 setTimeout(()=>{if(ui.screen==="boot"){ui.screen="login";render();}},5000);
 try{firebase.initializeApp(cfg);}catch(e){}
 const fdb=firebase.firestore();
 fdb.enablePersistence({synchronizeTabs:true}).catch(()=>{});
 firebase.auth().onAuthStateChanged(u=>{
  if(unsub){unsub();unsub=null;}
  if(!u){db=null;ui={screen:"login",vid:null,tab:"cliente",rid:null,openSec:{},guide:{},confirmDel:null};render();return;}
  db=fdb;if(ui.screen==="login"||ui.screen==="boot")ui.screen="home";render();listen();});
}
function listen(){
 let timer=setTimeout(()=>setSync("off"),10000);
 unsub=db.collection("visitas").onSnapshot({includeMetadataChanges:true},snap=>{
  if(!snap.metadata.fromCache){clearTimeout(timer);if(!Object.values(inflight).some(Boolean))setSync("ok");}else if(!navigator.onLine)setSync("off");
  let changed=false;const remoteIds=new Set();
  snap.docs.forEach(d=>{remoteIds.add(d.id);const r=d.data();if(!r)return;const l=visits[d.id];
   if(!l||(r.atualizado||0)>(l.atualizado||0)){visits[d.id]=JSON.parse(JSON.stringify(r));changed=true;}});
  if(!snap.metadata.fromCache)Object.keys(visits).forEach(id=>{const r=snap.docs.find(d=>d.id===id);if(!remoteIds.has(id)||((r.data()||{}).atualizado||0)<(visits[id].atualizado||0))pushRemote(id);});
  if(changed){saveLocal();if(!isTyping())render();}
 },e=>{clearTimeout(timer);setSync("bad");});
}
function isTyping(){const a=document.activeElement;return a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA");}

/* ============ CÁLCULOS ============ */
function pdOf(v){const n=num(v.cliente.pd);return isFinite(n)?n:2.7;}
function calc(room,v){const m=room.med||{};const c=num(m.c),l=num(m.l);const h=isFinite(num(m.h))?num(m.h):pdOf(v);
 if(room.tipo==="Telhado"){const i=num(m.incl);let a=isFinite(num(m.area))?num(m.area):(c*l);if(isFinite(i)&&!isFinite(num(m.area)))a=a*Math.sqrt(1+Math.pow(i/100,2));return {area:a,proj:c*l};}
 const area=isFinite(num(m.area))?num(m.area):c*l;
 const per=isFinite(num(m.per))?num(m.per):2*(c+l);
 const vaos=isFinite(num(m.vaos))?num(m.vaos):0;
 return {area,per,h,par:per*h-vaos};}

/* ============ PROGRESSO / PENDÊNCIAS ============ */
function visibleFields(sec,r,room){return sec.f.filter(f=>{if(sec.g&&f.id!==sec.g){if(empty(r[sec.g])||sec.off.includes(r[sec.g]))return false;}
 if(f.wet&&!WET.includes(room.tipo))return false;if(f.w&&!f.w(r))return false;return true;});}
function secActive(sid,r){const sec=S[sid];if(!r)return false;
 if(sec.g)return !empty(r[sec.g])&&!sec.off.includes(r[sec.g]);
 return Object.keys(r).some(k=>!k.endsWith("_outro")&&!k.endsWith("_ref")&&k!=="obs"&&!empty(r[k])&&!(Array.isArray(r[k])&&r[k].length===1&&["Manter pontos","Nenhum"].includes(r[k][0])));}
function secTouched(r){return r&&Object.keys(r).some(k=>!empty(r[k]));}
function roomProgress(room){const secs=ROOMS[room.tipo]||[];let t=secs.length+1,d=0;
 const m=room.med||{};if((num(m.c)&&num(m.l))||num(m.area))d++;
 secs.forEach(s=>{if(secTouched(room.resp[s]))d++;});return {d,t};}
function pendencias(v){const p=[];const c=v.cliente;
 if(!c.nome)p.push("Nome do cliente");if(!c.tel)p.push("Telefone do cliente");if(!c.end)p.push("Endereço da obra");
 if(!v.ambientes.length)p.push("Nenhum ambiente cadastrado");
 v.ambientes.forEach(room=>{const m=room.med||{};
  if(!((num(m.c)&&num(m.l))||num(m.area)))p.push(`${room.nome}: medidas`);
  const secs=ROOMS[room.tipo]||[];const asked=secs.filter(s=>secTouched(room.resp[s])).length;
  if(room.tipo!=="Outro"&&asked<secs.length)p.push(`${room.nome}: ${secs.length-asked} item(ns) não perguntado(s)`);
  secs.forEach(sid=>{const r=room.resp[sid];if(!secActive(sid,r))return;
   visibleFields(S[sid],r,room).forEach(f=>{if(f.req&&empty(r[f.id])&&empty(r[f.id+"_ref"]))p.push(`${room.nome} · ${S[sid].n}: ${lc(f.l)}`);});});});
 return p;}

function optVisual(f,o){

function chipsHTML(path,f,cur){const sel=x=>Array.isArray(cur)?cur.includes(x):cur===x;

 return `<div class="chips">${opts.map(o=>{const vis=optVisual(f,o);return `<button class="chip${vis&&vis.startsWith("<svg")?" hasic":""}${o===LATER?" later":""}" aria-pressed="${sel(o)}" data-act="pick" data-path="${path}" data-v="${esc(o)}" data-mode="${mode}">${vis}${esc(o)}</button>`;}).join("")}</div>`;}

 if(f.t==="num")h+=`<div class="numrow"><input class="mono" data-bind="${path}" value="${esc(cur||"")}" inputmode="decimal" aria-label="${esc(f.l)}"><span class="muted">${esc(f.u||"")}</span></div>`;

function cur(){return visits[ui.vid];}

function resolve(path){const v=cur();const [head,...rest]=path.split(".");
 if(head==="room"){const room=curRoom();const sid=rest[0];room.resp[sid]=room.resp[sid]||{};return [room.resp[sid],rest[1]];}
 if(head==="med"){const room=curRoom();room.med=room.med||{};return [room.med,rest[0]];}
 if(head==="roomname")return [curRoom(),"nome"];
 if(head==="roomobs")return [curRoom(),"obs"];
 if(head==="geral"){v.geral=v.geral||{};return [v.geral,rest[0]];}
 return [v[head],rest[0]];}
let toastT;function toast(t){let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);}el.textContent=t;clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),2200);}
function rerenderBlock(el){const det=el.closest("details.sec");

  const dy=nd.getBoundingClientRect().top-y;if(dy)scrollBy(0,dy);}
 else{const y=scrollY;render();scrollTo(0,y);}}

 const em=$("#lg-e").value.trim(),pw=$("#lg-p").value;const er=$("#lg-err");er.style.color="";er.textContent="Entrando…";
 try{await firebase.auth().signInWithEmailAndPassword(em,pw);}
 catch(x){const m={"auth/invalid-credential":"E-mail ou senha incorretos.","auth/wrong-password":"E-mail ou senha incorretos.","auth/user-not-found":"E-mail ou senha incorretos.","auth/invalid-email":"E-mail inválido.","auth/missing-password":"Digite a senha.","auth/too-many-requests":"Muitas tentativas. Espere alguns minutos.","auth/network-request-failed":"Sem internet. O primeiro acesso precisa de conexão."};
  er.textContent=m[x.code]||("Não foi possível entrar ("+x.code+").");}});
app.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act;const v=cur();
 if(a==="toggle"){e.preventDefault();const room=curRoom();const key=room.id+el.dataset.sid;ui.openSec[key]=!ui.openSec[key];el.parentElement.open=ui.openSec[key];return;}
 if(a==="guide"){ui.guide[el.dataset.g]=!ui.guide[el.dataset.g];rerenderBlock(el);return;}
 if(a==="new"){const nv=newVisit();touch(nv);ui={...ui,screen:"visit",vid:nv.id,tab:"cliente",confirmDel:null};render();scrollTo(0,0);return;}
 if(a==="open"){ui.screen="visit";ui.vid=el.dataset.id;ui.tab="ambientes";ui.confirmDel=null;render();scrollTo(0,0);return;}
 if(a==="home"){ui.screen="home";ui.confirmDel=null;render();scrollTo(0,0);return;}
 if(a==="visit"){ui.screen="visit";ui.tab="ambientes";ui.confirmDel=null;render();scrollTo(0,0);return;}
 if(a==="tab"){ui.tab=el.dataset.tab;ui.confirmDel=null;render();scrollTo(0,0);return;}
 if(a==="addroom"){const t=el.dataset.type;const same=v.ambientes.filter(x=>x.tipo===t).length;
  const room={id:uid(),tipo:t,nome:same?`${t} ${same+1}`:t,med:{},resp:{},obs:""};v.ambientes.push(room);touch(v);
  ui.screen="room";ui.rid=room.id;ui.openSec={};const secs=ROOMS[t];ui.openSec[room.id+(secs.includes("piso")?"piso":secs[0])]=true;render();scrollTo(0,0);return;}
 if(a==="room"){ui.screen="room";ui.rid=el.dataset.rid;ui.confirmDel=null;render();scrollTo(0,0);return;}
 if(a==="pick"){const [o,k]=resolve(el.dataset.path);const val=el.dataset.v;
  if(el.dataset.mode==="many"){const arr=Array.isArray(o[k])?o[k].slice():[];const i=arr.indexOf(val);if(i>=0)arr.splice(i,1);else arr.push(val);o[k]=arr;}
  else o[k]=o[k]===val?"":val;
  touch(v);rerenderBlock(el);return;}
 if(a==="delroom"){ui.confirmDel=ui.rid;render();return;}
 if(a==="delroom2"){v.ambientes=v.ambientes.filter(x=>x.id!==ui.rid);touch(v);ui.screen="visit";ui.tab="ambientes";ui.confirmDel=null;render();toast("Ambiente excluído");return;}
 if(a==="cancelDel"){ui.confirmDel=null;render();return;}
 if(a==="delvisit"){ui.confirmDel="visit";render();return;}
 if(a==="delvisit2"){const id=v.id;visits[id]={id,apagado:true,atualizado:Date.now()};saveLocal();pushRemote(id);ui={screen:"home",vid:null,tab:"cliente",rid:null,openSec:{},guide:{},confirmDel:null};render();toast("Visita excluída");return;}
 if(a==="concluir"){v.status="concluida";v.concluida=new Date().toISOString();touch(v);render();scrollTo(0,0);toast("Visita concluída e salva");return;}
 if(a==="reabrir"){v.status="rascunho";touch(v);render();return;}
 if(a==="doc"){ui.screen="doc";render();scrollTo(0,0);return;}
 if(a==="fechar"){ui.screen="visit";ui.tab="fechar";render();scrollTo(0,0);return;}
 if(a==="sair"){firebase.auth().signOut();return;}
 if(a==="esqueci"){const em=($("#lg-e")||{}).value||"";const er=$("#lg-err");if(!em.trim()){er.textContent="Digite seu e-mail acima e toque de novo em “Esqueci a senha”.";return;}
  firebase.auth().sendPasswordResetEmail(em.trim()).then(()=>{er.style.color="var(--ok)";er.textContent="Enviamos um link para criar nova senha em "+em.trim()+".";}).catch(()=>{er.textContent="Não foi possível enviar. Confira o e-mail.";});return;}
});

loadLocal();render();initDb();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
